    <title>SUPABASE TABLE EDITOR | DYNASTY WEAR'S</title>

              "background": "#121414", "primary": "#f2ca50",

            },
            "fontFamily": {
              "headline-md": ["Bodoni Moda"], "display-lg": ["Bodoni Moda"],
              "label-caps": ["DM Sans"], "headline-lg": ["Bodoni Moda"],

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
    <nav class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl border-b border-surface-variant flex justify-between items-center px-8 md:px-20 h-20 transition-all duration-300">
        <div class="font-display-lg text-2xl tracking-tighter text-primary"><a href="index.html">DYNASTY WEAR'S <span class="text-xs uppercase tracking-widest text-on-surface-variant ml-2">Supabase Admin</span></a></div>
        <div class="flex items-center gap-6">
            <a href="account.html" class="font-label-caps text-xs text-on-surface-variant hover:text-primary transition-colors uppercase">Back to Account</a>
        </div>
    </nav>

    <main class="flex-grow pt-32 pb-32 px-8 md:px-20 max-w-[1400px] mx-auto w-full">
        <div class="flex justify-between items-end mb-8">
            <div>
                <h1 class="font-display-lg text-4xl lg:text-5xl font-light mb-2 text-primary">Table Editor</h1>
                <p class="text-on-surface-variant">Live view of Supabase Database Tables (Orders & Profiles).</p>
            </div>
            <div class="text-right">
                <p class="font-label-caps text-xs text-on-surface-variant uppercase tracking-widest mb-1">Total Revenue</p>
                <p class="text-3xl text-primary font-bold">₹<span id="total-revenue">0</span></p>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex gap-8 mb-8 border-b border-surface-variant font-label-caps text-sm tracking-widest uppercase">
            <button class="tab-btn active pb-4 px-2" onclick="switchTab('orders')">Orders Table</button>
            <button class="tab-btn pb-4 px-2 text-on-surface-variant" onclick="switchTab('users')">Profiles Table</button>
        </div>

        <!-- Orders Table -->
        <div id="tab-orders" class="bg-surface-container-low border border-surface-variant rounded-lg overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[1000px]">
                <thead>
                    <tr class="bg-surface-variant/30 font-label-caps text-xs text-on-surface-variant uppercase tracking-widest">
                        <th class="p-4 border-b border-surface-variant">Order ID</th>
                        <th class="p-4 border-b border-surface-variant">Date</th>
                        <th class="p-4 border-b border-surface-variant">Customer Details</th>
                        <th class="p-4 border-b border-surface-variant">Payment Info</th>
                        <th class="p-4 border-b border-surface-variant">Total</th>
                        <th class="p-4 border-b border-surface-variant">Status</th>
                    </tr>
                </thead>
                <tbody id="admin-orders-container" class="text-sm">
                    <tr><td colspan="6" class="p-8 text-center text-on-surface-variant">Loading orders from Supabase...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Users Table -->
        <div id="tab-users" class="hidden bg-surface-container-low border border-surface-variant rounded-lg overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[1000px]">
                <thead>
                    <tr class="bg-surface-variant/30 font-label-caps text-xs text-on-surface-variant uppercase tracking-widest">
                        <th class="p-4 border-b border-surface-variant">User ID (UUID)</th>
                        <th class="p-4 border-b border-surface-variant">Email</th>
                        <th class="p-4 border-b border-surface-variant">Role</th>
                        <th class="p-4 border-b border-surface-variant">Created At</th>
                    </tr>
                </thead>
                <tbody id="admin-users-container" class="text-sm">
                    <tr><td colspan="4" class="p-8 text-center text-on-surface-variant">Loading profiles from Supabase...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/ecommerce.js?v=2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await getUser();
            if (!user) {
                alert("Please login first.");
                window.location.href = 'account.html';
                return;
            }
            
            // Check if user is admin in Supabase (or fallback local check for testing)
            const profiles = await getAllProfiles();
            const isAdmin = profiles.find(p => p.id === user.id && p.role === 'admin') || user.email.includes('admin');
            
            if (!isAdmin) {
                alert("Unauthorized Access. You must be an admin in the Supabase 'profiles' table to view this page.\n\nPlease go to your Supabase Dashboard -> Table Editor -> profiles, and change your user's role to 'admin'.");
                window.location.href = 'account.html';
                return;
            }

            await renderAdminOrders();
            await renderAdminUsers(profiles);
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active', 'text-on-surface-variant'));
            event.target.classList.add('active');
            event.target.classList.remove('text-on-surface-variant');

            document.getElementById('tab-orders').classList.add('hidden');
            document.getElementById('tab-users').classList.add('hidden');
            document.getElementById('tab-' + tabId).classList.remove('hidden');
        }

        async function renderAdminOrders() {
            const container = document.getElementById('admin-orders-container');
            const orders = await getAllOrders();
            
            let revenue = 0;
            container.innerHTML = '';

            if(!orders || orders.length === 0) {
                container.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-on-surface-variant">No orders found in Supabase.</td></tr>';
                return;
            }

            orders.forEach(order => {
                revenue += Number(order.total);
                
                let selectOptions = `
                    <option value="Processing" ${order.status === 'Processing' ? 'selected' : ''}>Processing</option>
                    <option value="Verification Pending" ${order.status === 'Verification Pending' ? 'selected' : ''}>Verification Pending</option>
                    <option value="Shipped" ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                    <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                    <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                `;

                // Handle payment details injected inside shipping JSONB
                const pMethod = order.shipping.payment ? order.shipping.payment.method : 'N/A';
                const pId = order.shipping.payment ? order.shipping.payment.transaction_id : 'N/A';

                const tr = document.createElement('tr');
                tr.className = 'border-b border-surface-variant/50 hover:bg-surface-variant/10 transition-colors';
                tr.innerHTML = `
                    <td class="p-4 font-label-caps text-xs uppercase text-primary">${order.id}</td>
                    <td class="p-4 text-xs text-on-surface-variant">${new Date(order.created_at || order.date).toLocaleString()}</td>
                    <td class="p-4">
                        <p class="font-bold">${order.shipping.name}</p>
                        <p class="text-xs text-on-surface-variant mb-1">${order.user_email || order.userEmail}</p>
                        <p class="text-xs text-on-surface-variant">${order.shipping.address}</p>
                        <p class="text-xs text-on-surface-variant">Phone: ${order.shipping.mobile}</p>
                    </td>
                    <td class="p-4">
                        <p class="text-xs uppercase"><span class="text-on-surface-variant">Method:</span> ${pMethod}</p>
                        <p class="text-xs"><span class="text-on-surface-variant">TXN ID:</span> ${pId}</p>
                    </td>
                    <td class="p-4 font-bold text-primary">₹${order.total}</td>
                    <td class="p-4">
                        <select onchange="updateStatus('${order.id}', this.value)" class="bg-surface border-surface-variant text-xs rounded focus:ring-primary focus:border-primary p-2">
                            ${selectOptions}
                        </select>
                    </td>
                `;
                container.appendChild(tr);
            });

            document.getElementById('total-revenue').textContent = revenue;
        }

        async function renderAdminUsers(profiles) {
            const container = document.getElementById('admin-users-container');
            container.innerHTML = '';

            if(!profiles || profiles.length === 0) {
                container.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-on-surface-variant">No profiles found in Supabase. Check RLS policies.</td></tr>';
                return;
            }

            profiles.forEach(profile => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-surface-variant/50 hover:bg-surface-variant/10 transition-colors';
                tr.innerHTML = `
                    <td class="p-4 font-mono text-xs text-on-surface-variant">${profile.id}</td>
                    <td class="p-4">${profile.email}</td>
                    <td class="p-4 font-label-caps text-xs uppercase ${profile.role === 'admin' ? 'text-primary' : 'text-on-surface'}">${profile.role}</td>
                    <td class="p-4 text-xs text-on-surface-variant">${new Date(profile.created_at).toLocaleString()}</td>
                `;
                container.appendChild(tr);
            });
        }

        async function updateStatus(orderId, newStatus) {
            await updateOrderStatus(orderId, newStatus);
            alert(`Order ${orderId} successfully updated in Supabase to ${newStatus}`);
        }
    </script>
</body>
</html>
