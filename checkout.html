<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>CHECKOUT | DYNASTY WEAR'S</title>
    <meta name="description" content="Secure Checkout.">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "surface-variant": "#343535", "surface-container-low": "#1b1c1c",
              "surface-container": "#1f2020", "primary-container": "#d4af37",
              "surface": "#121414", "on-surface-variant": "#d0c5af",
              "background": "#121414", "primary": "#f2ca50",
              "on-surface": "#e3e2e2", "on-background": "#e3e2e2",
              "on-primary": "#3c2f00", "error": "#ffb4ab", "on-error": "#690005"
            },
            "fontFamily": {
              "headline-md": ["Bodoni Moda"], "display-lg": ["Bodoni Moda"],
              "label-caps": ["DM Sans"], "headline-lg": ["Bodoni Moda"],
              "body-md": ["DM Sans"], "body-lg": ["DM Sans"]
            }
          }
        }
      }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
    <nav class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl border-b border-surface-variant flex justify-between items-center px-8 md:px-20 h-20 transition-all duration-300">
        <div class="font-display-lg text-2xl tracking-tighter text-primary"><a href="index.html">DYNASTY WEAR'S</a></div>
        <div class="flex items-center gap-6">
            <a href="cart.html" class="font-label-caps text-xs text-on-surface-variant hover:text-primary transition-colors uppercase">Back to Cart</a>
        </div>
    </nav>

    <main class="flex-grow pt-32 pb-32 px-8 md:px-20 max-w-[1200px] mx-auto w-full">
        <h1 class="font-display-lg text-4xl lg:text-5xl font-light mb-12">Checkout</h1>
        
        <div class="flex flex-col lg:flex-row gap-12">
            <div class="w-full lg:w-2/3 space-y-8">
                <form id="checkout-form" class="space-y-8">
                    <!-- Shipping -->
                    <div class="bg-surface-container-low p-8 border border-surface-variant rounded-lg">
                        <h2 class="font-headline-lg text-2xl mb-6">Shipping Details</h2>
                        <div class="grid grid-cols-2 gap-6">
                            <div>
                                <label class="block font-label-caps text-xs text-on-surface-variant mb-2 uppercase">First Name</label>
                                <input required type="text" id="firstName" class="w-full bg-transparent border-surface-variant focus:border-primary focus:ring-0 rounded">
                            </div>
                            <div>
                                <label class="block font-label-caps text-xs text-on-surface-variant mb-2 uppercase">Last Name</label>
                                <input required type="text" id="lastName" class="w-full bg-transparent border-surface-variant focus:border-primary focus:ring-0 rounded">
                            </div>
                            <div class="col-span-2">
                                <label class="block font-label-caps text-xs text-on-surface-variant mb-2 uppercase">Mobile Number</label>
                                <input required type="tel" id="mobile" class="w-full bg-transparent border-surface-variant focus:border-primary focus:ring-0 rounded">
                            </div>
                            <div>
                                <label class="block font-label-caps text-xs text-on-surface-variant mb-2 uppercase">House Number</label>
                                <input required type="text" id="houseNumber" class="w-full bg-transparent border-surface-variant focus:border-primary focus:ring-0 rounded">
                            </div>
                            <div>
                                <label class="block font-label-caps text-xs text-on-surface-variant mb-2 uppercase">Street</label>
                                <input required type="text" id="street" class="w-full bg-transparent border-surface-variant focus:border-primary focus:ring-0 rounded">
                            </div>
                            <div class="col-span-2">
                                <label class="block font-label-caps text-xs text-on-surface-variant mb-2 uppercase">Landmark</label>
                                <input required type="text" id="landmark" class="w-full bg-transparent border-surface-variant focus:border-primary focus:ring-0 rounded">
                            </div>
                            <div>
                                <label class="block font-label-caps text-xs text-on-surface-variant mb-2 uppercase">City</label>
                                <input required type="text" id="city" class="w-full bg-transparent border-surface-variant focus:border-primary focus:ring-0 rounded">
                            </div>
                            <div>
                                <label class="block font-label-caps text-xs text-on-surface-variant mb-2 uppercase">Pin Code</label>
                                <input required type="text" id="pinCode" class="w-full bg-transparent border-surface-variant focus:border-primary focus:ring-0 rounded">
                            </div>
                            <div class="col-span-2">
                                <label class="block font-label-caps text-xs text-on-surface-variant mb-2 uppercase">Country</label>
                                <input required type="text" id="country" class="w-full bg-transparent border-surface-variant focus:border-primary focus:ring-0 rounded">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Payment Details -->
                    <div class="bg-surface-container-low p-8 border border-surface-variant rounded-lg">
                        <h2 class="font-headline-lg text-2xl mb-6">Payment Method</h2>
                        
                        <div class="space-y-4 mb-6">
                            <label class="flex items-center gap-4 cursor-pointer p-4 border border-surface-variant rounded hover:border-primary transition-colors">
                                <input type="radio" name="paymentMethod" value="cod" class="text-primary focus:ring-primary bg-transparent border-surface-variant h-5 w-5" checked onchange="togglePaymentQR()">
                                <div>
                                    <span class="block font-label-caps text-sm uppercase">Cash on Delivery</span>
                                    <span class="block text-xs text-on-surface-variant mt-1">Requires ₹100 advance payment via QR. Remaining balance paid at delivery.</span>
                                </div>
                            </label>
                            
                            <label class="flex items-center gap-4 cursor-pointer p-4 border border-surface-variant rounded hover:border-primary transition-colors">
                                <input type="radio" name="paymentMethod" value="full" class="text-primary focus:ring-primary bg-transparent border-surface-variant h-5 w-5" onchange="togglePaymentQR()">
                                <div>
                                    <span class="block font-label-caps text-sm uppercase">Pay Full Amount</span>
                                    <span class="block text-xs text-on-surface-variant mt-1">Pay the full cart total via QR Code securely.</span>
                                </div>
                            </label>
                        </div>
                        
                        <!-- QR Code Section -->
                        <div id="qr-section" class="bg-surface/50 p-6 rounded-lg border border-primary/20 text-center">
                            <h3 class="font-label-caps text-sm text-primary mb-4 uppercase tracking-widest" id="qr-instruction">Scan to pay ₹100 Advance</h3>
                            <div class="bg-white p-2 inline-block rounded-xl mb-4 shadow-lg shadow-primary/10">
                                <img src="assets/qr_code.jpg" alt="Payment QR Code" class="w-48 h-48 object-contain" onerror="this.src='https://via.placeholder.com/200?text=QR+Code+Missing'">
                            </div>
                            <p class="text-xs text-on-surface-variant mb-6">Open your UPI app (GPay, PhonePe, Paytm) and scan the QR code to make the payment.</p>
                            
                            <div class="text-left">
                                <label class="block font-label-caps text-xs text-on-surface-variant mb-2 uppercase">Transaction ID / UTR Number *</label>
                                <input required type="text" id="transactionId" placeholder="e.g. 312345678901" class="w-full bg-transparent border-surface-variant focus:border-primary focus:ring-0 rounded">
                                <p class="text-[10px] text-on-surface-variant mt-2">Please enter the 12-digit UTR/Transaction ID after paying.</p>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="w-full h-14 bg-primary text-on-primary font-label-caps text-sm tracking-[0.2em] uppercase hover:bg-primary-container active:scale-[0.98] transition-all shadow-lg mt-8">
                        Place Order (₹<span id="submit-total">0</span>)
                    </button>
                </form>
            </div>
            
            <!-- Summary Sidebar -->
            <div class="w-full lg:w-1/3">
                <div class="sticky top-32 bg-surface-container-low p-8 border border-surface-variant rounded-lg">
                    <h2 class="font-headline-lg text-2xl mb-6">Order Summary</h2>
                    <div id="summary-items" class="space-y-4 mb-6 border-b border-surface-variant pb-6">
                        <!-- Items here -->
                    </div>
                    <div class="flex justify-between font-label-caps text-lg">
                        <span>Total</span>
                        <span class="text-primary font-bold">₹<span id="sidebar-total">0</span></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/ecommerce.js?v=2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const cart = await getCart();
            if(cart.length === 0) {
                window.location.href = 'cart.html';
                return;
            }
            
            const user = await getUser();

            let subtotal = 0;
            let flatCart = [];
            const summaryContainer = document.getElementById('summary-items');
            
            cart.forEach(item => {
                subtotal += (item.price * item.quantity);
                for(let i=0; i<item.quantity; i++) {
                    flatCart.push({ price: item.price });
                }
                
                const itemEl = document.createElement('div');
                itemEl.className = 'flex justify-between text-sm';
                itemEl.innerHTML = `
                    <span class="text-on-surface-variant">${item.name} (x${item.quantity})</span>
                    <span>₹${item.price * item.quantity}</span>
                `;
                summaryContainer.appendChild(itemEl);
            });
            
            // Buy Any 2 Get 1 Free Calculation (Only for items priced at ₹549)
            let eligibleItems = flatCart.filter(item => Number(item.price) === 549);
            let discount = Math.floor(eligibleItems.length / 3) * 549;
            
            let total = subtotal - discount;
            
            if(discount > 0) {
                const discountEl = document.createElement('div');
                discountEl.className = 'flex justify-between text-sm text-primary mt-2 border-t border-surface-variant/50 pt-2';
                discountEl.innerHTML = `
                    <span>Buy Any 2 Get 1 Free</span>
                    <span>-₹${discount}</span>
                `;
                summaryContainer.appendChild(discountEl);
            }
            
            document.getElementById('submit-total').textContent = total;
            document.getElementById('sidebar-total').textContent = total;
        });

        function togglePaymentQR() {
            const method = document.querySelector('input[name="paymentMethod"]:checked').value;
            const instruction = document.getElementById('qr-instruction');
            const total = document.getElementById('sidebar-total').textContent;
            
            if (method === 'cod') {
                instruction.textContent = 'Scan to pay ₹100 Advance';
            } else {
                instruction.textContent = 'Scan to pay Full Amount (₹' + total + ')';
            }
        }

        document.getElementById('checkout-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const mobile = document.getElementById('mobile').value;
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            
            const houseNumber = document.getElementById('houseNumber').value;
            const street = document.getElementById('street').value;
            const landmark = document.getElementById('landmark').value;
            const city = document.getElementById('city').value;
            const pinCode = document.getElementById('pinCode').value;
            const country = document.getElementById('country').value;
            
            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
            const transactionId = document.getElementById('transactionId').value;
            
            const address = `${houseNumber}, ${street}, ${landmark}, ${city} - ${pinCode}, ${country}`;
            
            const shipping = { mobile, name: `${firstName} ${lastName}`, address };
            const payment = { method: paymentMethod, transaction_id: transactionId, status: 'Pending Verification' };
            const order = await placeOrder(shipping, payment);
            
            if(order) {
                alert(`Order Placed Successfully!\nYour payment is currently Pending Verification.\n(Order ID: ${order.id})`);
                window.location.href = 'account.html';
            }
        });
    </script>
</body>
</html>
